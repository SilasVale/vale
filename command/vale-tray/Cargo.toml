# Standalone crate (kept out of the main workspace so its Windows-only tray
# dependencies don't affect the Linux build).
[workspace]

[package]
name = "vale-tray"
version = "0.1.0"
edition = "2021"
description = "Vale Command system tray controller (status / start-stop-restart / copy MCP config / open console / local terminal)"

[[bin]]
name = "vale-tray"
path = "src/main.rs"

[dependencies]
tray-icon = "0.19"
winit = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[profile.release]
strip = true
