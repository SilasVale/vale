<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vale Studio · Workspace Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b7a6e'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='monospace'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/style.css?v=8">
</head>
<body>
<div id="app">
  <div id="titlebar">
    <span class="brand">⌘ Vale Studio</span>
    <select id="root-select" title="工作区根目录"></select>
    <span id="root-git" class="git-info"></span>
    <span class="spacer"></span>
    <button id="btn-readonly-hint" class="tb-btn" hidden title="服务器处于只读模式">只读模式</button>
  </div>

  <div id="main">
    <div id="activitybar">
      <button class="act-btn active" data-view="explorer" title="资源管理器 (文件树)">📄</button>
      <button class="act-btn" data-view="search" title="全局搜索 (Ctrl+Shift+F)">🔍</button>
      <button class="act-btn" data-view="settings" title="设置">⚙</button>
    </div>

    <div id="sidebar">
      <!-- explorer view -->
      <div id="view-explorer" class="side-view">
        <div class="side-head">
          <span>资源管理器</span>
          <span class="head-actions">
            <button id="btn-newfile" class="icon-btn" title="新建文件">＋</button>
            <button id="btn-newdir" class="icon-btn" title="新建目录">🗀</button>
            <button id="btn-refresh" class="icon-btn" title="刷新">⟳</button>
          </span>
        </div>
        <div id="tree" class="tree"></div>
      </div>
      <!-- search view -->
      <div id="view-search" class="side-view" hidden>
        <div class="side-head"><span>全局搜索</span></div>
        <div class="search-box">
          <input id="search-input" type="text" placeholder="搜索 (ripgrep)…" spellcheck="false">
          <label class="chk"><input type="checkbox" id="search-regex"> .* 正则</label>
          <label class="chk"><input type="checkbox" id="search-case"> Aa 区分大小写</label>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
      <!-- settings view -->
      <div id="view-settings" class="side-view" hidden>
        <div class="side-head"><span>设置</span></div>
        <div class="settings-body">
          <p>Token: <button id="btn-forget-token" class="mini-btn">清除本机 token</button></p>
          <p id="settings-server"></p>
        </div>
      </div>
    </div>

    <div id="workarea">
      <div id="tabbar">
        <div id="tabs"></div>
        <span class="spacer"></span>
        <button id="btn-save" class="tb-btn" title="保存到磁盘 (Ctrl+S)">💾 保存</button>
      </div>

      <div id="editor-stack">
        <div id="welcome" class="welcome">
          <h1>Vale Studio</h1>
          <p>saisi.online 工作区代码编辑器 · 连接真实文件</p>
          <ul>
            <li><b>左侧</b> 打开文件树浏览</li>
            <li><b>Ctrl+P</b> 快速打开文件</li>
            <li><b>Ctrl+S</b> 保存到磁盘</li>
            <li><b>Ctrl+`</b> 集成终端</li>
            <li>从 DSH 聊天里的文件路径可以直接点过来</li>
          </ul>
        </div>
        <div id="editor-host"></div>
        <div id="conflict-banner" hidden>
          <span id="conflict-text"></span>
          <button id="conflict-reload" class="mini-btn">从磁盘重新加载</button>
          <button id="conflict-overwrite" class="mini-btn danger">仍要覆盖</button>
          <button id="conflict-dismiss" class="mini-btn">忽略</button>
        </div>
        <div id="toast-layer"></div>
      </div>

      <div id="terminal-panel" hidden>
        <div id="term-tabs">
          <div id="term-tablist"></div>
          <span class="head-actions">
            <button id="btn-term-new" class="icon-btn" title="新建终端">＋</button>
            <button id="btn-term-close" class="icon-btn" title="关闭面板">✕</button>
          </span>
        </div>
        <div id="term-hosts"></div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="sb-root"></span>
    <span class="spacer"></span>
    <span id="sb-pos">Ln 1, Col 1</span>
    <span id="sb-lang"></span>
    <span id="sb-backend"></span>
  </div>
</div>

<!-- token gate -->
<div id="token-gate" hidden>
  <div class="gate-card">
    <h2>Vale Studio</h2>
    <p>输入访问令牌（服务端 ~/.vale-studio/config.json 的 token）</p>
    <input id="gate-token" type="password" placeholder="access token" autocomplete="off">
    <button id="gate-go">进入</button>
    <p id="gate-err" class="gate-err"></p>
  </div>
</div>

<!-- quick open -->
<div id="quickopen" hidden>
  <input id="quickopen-input" type="text" placeholder="输入文件名过滤… (Esc 关闭)" spellcheck="false">
  <div id="quickopen-list"></div>
</div>

<!-- tree context menu -->
<div id="ctxmenu" hidden></div>

<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/addon-fit.js"></script>
<script src="/vendor/xterm/addon-web-links.js"></script>
<script src="/vendor/monaco/vs/loader.js"></script>
<script src="/js/api.js?v=8"></script>
<script src="/js/tree.js?v=8"></script>
<script src="/js/editor.js?v=8"></script>
<script src="/js/terminal.js?v=8"></script>
<script src="/js/app.js?v=8"></script>
</body>
</html>
