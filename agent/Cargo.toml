[workspace]
members = [".", "vale-command-core"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "1.0.145"

[package]
name = "vale-agent"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "vale-agent"
path = "src/main.rs"

[dependencies]
vale-agent-core = { path = "vale-command-core" }
rmcp = { version = "2", features = ["server", "transport-streamable-http-server", "macros", "client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
axum = "0.8"
bytes = "1"
http-body-util = "0.1"
tower = "0.5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
process-wrap = { version = "9", features = ["tokio1"] }
wait-timeout = "0.2"

# Optional deps — gated behind features; headless builds skip them entirely.
russh = { version = "0.55", default-features = false, features = ["ring"], optional = true }
russh-sftp = { version = "2.3", optional = true }
portable-pty = { version = "0.8", optional = true }
keyring = { version = "2", optional = true }

serde_yaml = "0.9"

# HTTP client for the update plugin (agent_update MCP tool). rustls-tls keeps the
# cross-compile pure-Rust — native-tls pulls Windows schannel and breaks xwin.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Installer integrity check (agent_update): the release server publishes the
# SHA-256 of ValeAgent-Setup.exe; the agent verifies the download before
# spawning it (an AI-triggerable RCE path must not trust the transport alone).
sha2 = "0.10"

# Binary writes to terminal sessions (terminal_write data_base64) — a JSON
# string argument goes through UTF-8 validation, so non-UTF-8 serial frames
# (control bytes, binary protocols) need an explicit base64 path (round-54).
base64 = "0.22"

# round-137 Plan C: the hand-rolled WebSocket upgrade for /api/browser/ws
# needs to compute Sec-WebSocket-Accept (SHA-1); hyper is explicitly
# introduced to use upgrade::on and get the raw IO after the upgrade (axum
# 0.8 already depends on hyper 1, zero new compilation).
sha1 = "0.10"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

# Windows-only: lets the headless binary register itself as the `ValeCommand`
# Windows service (SCM protocol). Ignored entirely on Linux/macOS builds.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
rmcp = { version = "2", features = ["client", "transport-streamable-http-client-reqwest"] }


[features]
default = []
# Real terminal backends (PTY/SSH/Serial).
terminal = ["dep:portable-pty", "dep:russh", "dep:russh-sftp"]
# OS keychain secrets for SSH passwords.
keyring = ["dep:keyring"]

# ProcessPrng workaround: use CPU RDRAND instruction instead of Windows API
# This avoids the ProcessPrng/BCryptGenRandom dependency.
# All crates (ring, uuid) share this single getrandom instance.
[dependencies.getrandom]
version = "0.2"
features = ["rdrand"]

# stage-m: portable-pty is vendored + patched — its stock ConPTY flags set
# PSEUDOCONSOLE_WIN32_INPUT_MODE (0x4), which echoes console output back as
# input events; PSReadLine then renders `>>` after every OSC 633 (VS Code
# shell integration). The patch drops that flag (node-pty/VSCode parity).
[patch.crates-io]
portable-pty = { path = "vendor-portable-pty" }
