[workspace]
members = [".", "vale-command-core"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "1.0.9"

[package]
name = "vale-agent"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "vale-agent"
path = "src/main.rs"

[dependencies]
vale-agent-core = { path = "vale-command-core" }
rmcp = { version = "2", features = ["server", "transport-streamable-http-server", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
axum = "0.8"
bytes = "1"
http-body-util = "0.1"
tower = "0.5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

# Optional deps — gated behind features; headless builds skip them entirely.
russh = { version = "0.55", default-features = false, features = ["ring"], optional = true }
portable-pty = { version = "0.8", optional = true }
keyring = { version = "2", optional = true }

serde_yaml = "0.9"

# HTTP client for the update plugin (agent_update MCP tool). rustls-tls keeps the
# cross-compile pure-Rust — native-tls pulls Windows schannel and breaks xwin.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Windows-only: lets the headless binary register itself as the `ValeCommand`
# Windows service (SCM protocol). Ignored entirely on Linux/macOS builds.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
rmcp = { version = "2", features = ["client", "transport-streamable-http-client-reqwest"] }


[features]
default = []
# Real terminal backends (PTY/SSH/Serial).
terminal = ["dep:portable-pty", "dep:russh"]
# OS keychain secrets for SSH passwords.
keyring = ["dep:keyring"]

# ProcessPrng workaround: use CPU RDRAND instruction instead of Windows API
# This avoids the ProcessPrng/BCryptGenRandom dependency.
# All crates (ring, uuid) share this single getrandom instance.
[dependencies.getrandom]
version = "0.2"
features = ["rdrand"]
