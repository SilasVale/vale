[workspace]

[package]
name = "vale-desktop"
version = "0.1.0"
edition = "2021"
description = "Vale Agent desktop shell — multi-tab terminal + memory over the local agent"

[[bin]]
name = "vale-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
