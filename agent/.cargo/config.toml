[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
]

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
rustflags = [
    "-C", "target-feature=+crt-static",
    "--cfg", "getrandom_backend=\"windows_legacy\"",
]

[env]
# Target Windows 10
WINVER = "0x0A00"
_WIN32_WINNT = "0x0A00"
