server:
  # Loopback bind (security, 1.0.63+): the server is reached ONLY via the
  # cloudflared tunnel (ingress 127.0.0.1:18080) or locally. 0.0.0.0 exposed
  # the API to the LAN and the /panel/ Host gate is spoofable — LAN RCE.
  host: "127.0.0.1"
  port: 18080
  name: "vale-agent"

serial:
  default_baud_rate: 115200
  default_timeout_ms: 1000

# Deployment endpoints (saisi decouple): BOTH ARE OPTIONAL. A purely local
# install (terminal + memory + MCP) can leave them unset — cloud-dependent
# tools (agent_update, page_view remote pages, device self-register) then
# degrade with explicit errors. Set them when a console/update channel exists.
platform:
  console_url: "https://api.saisi.online"
  download_url: "https://agent.saisi.online"
