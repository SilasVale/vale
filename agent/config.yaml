server:
  # Loopback bind (security, 1.0.63+): the server is reached ONLY via the
  # cloudflared tunnel (ingress 127.0.0.2:18080) or locally. 0.0.0.0 exposed
  # the API to the LAN and the /panel/ Host gate is spoofable — LAN RCE.
  host: "127.0.0.2"
  port: 18080
  name: "vale-agent"

serial:
  default_baud_rate: 115200
  default_timeout_ms: 1000

# Deployment endpoints. Defaults are the production saisi.online hosts;
# override for a different deployment. The agent_update manifest is polled at
# {download_url}/api/version.
platform:
  console_url: "https://api.saisi.online"
  download_url: "https://agent.saisi.online"
