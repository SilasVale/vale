<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vale Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Cpath d='M20 16 L32 48 L44 16' fill='none' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    /* Connection form — shown on first load until host+token are saved. */
    #conn-form {
      max-width: 440px; margin: 10vh auto; padding: 32px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    }
    #conn-form h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.01em; }
    #conn-form label { display: block; margin: 14px 0 5px; font-size: 13px; color: #6e6e73; }
    #conn-form input { width: 100%; padding: 9px 12px; border: 1px solid rgba(0,0,0,0.14); border-radius: 10px; font: inherit; box-sizing: border-box; background: #fff; }
    #conn-form input:focus { outline: 2px solid #0e9384; outline-offset: 1px; border-color: transparent; }
    #conn-form .hint { font-size: 12px; color: #86868b; margin-top: 8px; }
    #conn-form button { margin-top: 18px; background: #0e9384; color: #fff; border: none; border-radius: 10px; padding: 9px 18px; cursor: pointer; font: 600 14px -apple-system, "PingFang SC", sans-serif; }
    #conn-form button:hover { background: #0b7a6e; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="conn-form">
    <h1>Vale Agent</h1>
    <label>Device hostname</label>
    <input id="host" placeholder="d1.agent.saisi.online" autocomplete="off">
    <label>Auth token</label>
    <input id="token" type="password" placeholder="Bearer token from D:\vale-command\config.yaml" autocomplete="off">
    <button id="save">Connect</button>
    <div class="hint">凭据保存在本浏览器(localStorage),不会上传到别处。</div>
    <div id="status"></div>
  </div>

  <div id="panel-main" class="hidden">
    <div id="toolbar">
      <select id="device-select"></select>
      <div id="tabs"></div>
      <button id="new-session">New PTY</button>
      <button id="export-all" title="Export all session logs">Export all</button>
    </div>
    <div id="term-container"></div>
    <div id="statusbar"><span id="status"></span></div>
  </div>

  <script src="vendor/xterm.min.js"></script>
  <script src="vendor/xterm-addon-fit.min.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>
