<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vale Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Cpath d='M20 16 L32 48 L44 16' fill='none' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    /* Connection form — shown on first load until host+token are saved. */
    #conn-form {
      max-width: 440px; margin: 10vh auto; padding: 32px;
      background: var(--surface-glass);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    #conn-form h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.01em; }
    #conn-form label { display: block; margin: 14px 0 5px; font-size: 13px; color: var(--muted); }
    #conn-form input { width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); font: inherit; box-sizing: border-box; background: var(--surface); }
    #conn-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    #conn-form .hint { font-size: 12px; color: var(--faint); margin-top: 8px; }
    #conn-form button { margin-top: 18px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 18px; cursor: pointer; font: 600 14px var(--font); }
    #conn-form button:hover { background: var(--accent-ink); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="conn-form">
    <h1>Vale Agent</h1>
    <label>Device hostname</label>
    <input id="host" placeholder="d1.agent.saisi.online" autocomplete="off">
    <label>Auth token</label>
    <input id="token" type="password" placeholder="Bearer token from C:\vale-agent\config.yaml" autocomplete="off">
    <button id="save">Connect</button>
    <div class="hint">凭据保存在本浏览器(localStorage),不会上传到别处。</div>
    <div id="conn-status"></div>
  </div>

  <div id="panel-main" class="hidden">
    <div id="toolbar">
      <select id="device-select"></select>
      <div id="tabs"></div>
      <div id="toolbar-actions">
        <button id="new-session" title="New local shell">PTY</button>
        <button id="new-ssh" title="New SSH connection">SSH</button>
        <button id="new-serial" title="New serial connection">Serial</button>
        <button id="export-all" title="Export all session logs">Export</button>
      </div>
    </div>
    <div id="term-container">
      <div id="empty-state" class="hidden">
        <div class="empty-card">
          <span class="empty-mark">V</span>
          <p>No sessions yet</p>
          <div class="empty-actions">
            <button id="empty-pty">New PTY</button>
            <button id="empty-ssh">New SSH</button>
            <button id="empty-serial">New Serial</button>
          </div>
        </div>
      </div>
    </div>
    <div id="statusbar"><span id="status"></span></div>

    <!-- Session creation modal (SSH / Serial) -->
    <div id="conn-modal" class="hidden">
      <div class="modal-card">
        <h2 id="modal-title">New SSH</h2>
        <div class="modal-fields" id="modal-fields"></div>
        <div class="modal-actions">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-connect" class="primary">Connect</button>
        </div>
        <div id="modal-status"></div>
      </div>
    </div>
  </div>

  <script src="vendor/xterm.min.js"></script>
  <script src="vendor/xterm-addon-fit.min.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>
