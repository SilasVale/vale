[package]
name = "vale-agent-core"
version.workspace = true
edition = "2021"
description = "Core framework for Vale Command — Plugin trait, config, error types, events"

[dependencies]
getrandom = { version = "0.2", features = ["rdrand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
