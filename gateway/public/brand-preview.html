<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vale Logo 打磨候选</title>
<style>
  body { margin: 0; font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #e9ecef; padding: 28px; }
  h1 { font-size: 18px; color: #212529; }
  p.note { color: #868e96; font-size: 13px; margin: 6px 0 20px; line-height: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; }
  .card { background: #fff; border: 1px solid #dee2e6; border-radius: 14px; padding: 18px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; color: #212529; }
  .card .desc { font-size: 12.5px; color: #868e96; margin-bottom: 12px; line-height: 19px; min-height: 38px; }
  .sizes { display: flex; align-items: flex-end; gap: 16px; padding: 14px; border-radius: 12px; background: #f8f9fa; border: 1px solid #e9ecef; }
  .dk { background: #121316; border: 1px solid #373a40; border-radius: 10px; padding: 10px; display: flex; align-items: flex-end; gap: 16px; margin-left: auto; }
  .cap { font-size: 11px; color: #adb5bd; text-align: center; margin-top: 4px; }
</style>
</head>
<body>

<h1>R4 打磨候选</h1>
<p class="note">同一琥珀底 + 圆丘语言，四个方向解决"中段空、缺记忆点"的问题。</p>

<div class="grid">

<!-- 0 当前版 -->
<div class="card">
  <h3>0 · 当前版（对照）</h3>
  <div class="desc">R4 原样：山偏低，太阳离垭口远。</div>
  <div class="sizes">
    <div><svg width="96" height="96" viewBox="0 0 48 48">
      <defs><linearGradient id="s0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59f00"/><stop offset="1" stop-color="#e8590c"/></linearGradient>
      <radialGradient id="g0" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e1" stop-opacity=".55"/><stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/></radialGradient></defs>
      <rect width="48" height="48" rx="11" fill="url(#s0)"/>
      <circle cx="21" cy="14" r="7.5" fill="url(#g0)"/>
      <circle cx="21" cy="14" r="4" fill="#fff8e1"/>
      <path fill="#ffffff" opacity=".78" d="M14 41Q26 16 44 41Z"/>
      <path fill="#ffffff" d="M2 41Q12 20 24 41Z"/>
    </svg><div class="cap">96px</div></div>
    <div><svg width="16" height="16" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="url(#s0)"/><circle cx="21" cy="14" r="4" fill="#fff8e1"/><path fill="#ffffff" opacity=".78" d="M14 41Q26 16 44 41Z"/><path fill="#ffffff" d="M2 41Q12 20 24 41Z"/></svg><div class="cap">16px</div></div>
    <div class="dk"><svg width="64" height="64" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="url(#s0)"/><circle cx="21" cy="14" r="4" fill="#fff8e1"/><path fill="#ffffff" opacity=".78" d="M14 41Q26 16 44 41Z"/><path fill="#ffffff" d="M2 41Q12 20 24 41Z"/></svg></div>
  </div>
</div>

<!-- A 收紧 -->
<div class="card">
  <h3>A · 收紧构图</h3>
  <div class="desc">山体抬高、太阳贴近垭口——消除中段空白，"从山后升起"而不是"漂在天上"。最稳的打磨。</div>
  <div class="sizes">
    <div><svg width="96" height="96" viewBox="0 0 48 48">
      <defs><linearGradient id="sa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59f00"/><stop offset="1" stop-color="#e8590c"/></linearGradient>
      <radialGradient id="ga" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e1" stop-opacity=".55"/><stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/></radialGradient></defs>
      <rect width="48" height="48" rx="11" fill="url(#sa)"/>
      <circle cx="18" cy="16" r="7.5" fill="url(#ga)"/>
      <circle cx="18" cy="16" r="4" fill="#fff8e1"/>
      <path fill="#ffffff" opacity=".78" d="M14 41Q24 10 44 41Z"/>
      <path fill="#ffffff" d="M2 41Q10 11 18 41Z"/>
    </svg><div class="cap">96px</div></div>
    <div><svg width="16" height="16" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="url(#sa)"/><circle cx="18" cy="16" r="4" fill="#fff8e1"/><path fill="#ffffff" opacity=".78" d="M14 41Q24 10 44 41Z"/><path fill="#ffffff" d="M2 41Q10 11 18 41Z"/></svg><div class="cap">16px</div></div>
    <div class="dk"><svg width="64" height="64" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="url(#sa)"/><circle cx="18" cy="16" r="4" fill="#fff8e1"/><path fill="#ffffff" opacity=".78" d="M14 41Q24 10 44 41Z"/><path fill="#ffffff" d="M2 41Q10 11 18 41Z"/></svg></div>
  </div>
</div>

<!-- B 藏V -->
<div class="card">
  <h3>B · 谷间藏 V ★推荐</h3>
  <div class="desc">两山内坡调成直线，中间天空负空间形成一个 V 字，太阳正落在 V 上——品牌字母藏进风景，越看越有东西。</div>
  <div class="sizes">
    <div><svg width="96" height="96" viewBox="0 0 48 48">
      <defs><linearGradient id="sb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59f00"/><stop offset="1" stop-color="#e8590c"/></linearGradient>
      <radialGradient id="gb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e1" stop-opacity=".55"/><stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/></radialGradient></defs>
      <rect width="48" height="48" rx="11" fill="url(#sb)"/>
      <circle cx="24" cy="18" r="7" fill="url(#gb)"/>
      <circle cx="24" cy="18" r="4" fill="#fff8e1"/>
      <path fill="#ffffff" opacity=".78" d="M46 41Q40 19 33 25L24 37Z"/>
      <path fill="#ffffff" d="M2 41Q8 20 15 26L24 37Z"/>
    </svg><div class="cap">96px</div></div>
    <div><svg width="16" height="16" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="url(#sb)"/><circle cx="24" cy="18" r="4" fill="#fff8e1"/><path fill="#ffffff" opacity=".78" d="M46 41Q40 19 33 25L24 37Z"/><path fill="#ffffff" d="M2 41Q8 20 15 26L24 37Z"/></svg><div class="cap">16px</div></div>
    <div class="dk"><svg width="64" height="64" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="url(#sb)"/><circle cx="24" cy="18" r="4" fill="#fff8e1"/><path fill="#ffffff" opacity=".78" d="M46 41Q40 19 33 25L24 37Z"/><path fill="#ffffff" d="M2 41Q8 20 15 26L24 37Z"/></svg></div>
  </div>
</div>

<!-- C 信号弧 -->
<div class="card">
  <h3>C · 信号弧</h3>
  <div class="desc">A 的构图 + 太阳上方一道细弧线，点题"信号/设备控制"。代价：16px 下弧线基本消失。</div>
  <div class="sizes">
    <div><svg width="96" height="96" viewBox="0 0 48 48">
      <defs><linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59f00"/><stop offset="1" stop-color="#e8590c"/></linearGradient>
      <radialGradient id="gc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8e1" stop-opacity=".55"/><stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/></radialGradient></defs>
      <rect width="48" height="48" rx="11" fill="url(#sc)"/>
      <path d="M11.5 9.5a8 8 0 0 1 13 0" stroke="#fff8e1" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".85"/>
      <circle cx="18" cy="17" r="7" fill="url(#gc)"/>
      <circle cx="18" cy="17" r="4" fill="#fff8e1"/>
      <path fill="#ffffff" opacity=".78" d="M14 41Q24 10 44 41Z"/>
      <path fill="#ffffff" d="M2 41Q10 11 18 41Z"/>
    </svg><div class="cap">96px</div></div>
    <div><svg width="16" height="16" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="url(#sc)"/><circle cx="18" cy="17" r="4" fill="#fff8e1"/><path fill="#ffffff" opacity=".78" d="M14 41Q24 10 44 41Z"/><path fill="#ffffff" d="M2 41Q10 11 18 41Z"/></svg><div class="cap">16px</div></div>
    <div class="dk"><svg width="64" height="64" viewBox="0 0 48 48"><rect width="48" height="48" rx="11" fill="url(#sc)"/><circle cx="18" cy="17" r="4" fill="#fff8e1"/><path fill="#ffffff" opacity=".78" d="M14 41Q24 10 44 41Z"/><path fill="#ffffff" d="M2 41Q10 11 18 41Z"/></svg></div>
  </div>
</div>

</div>
</body>
</html>
