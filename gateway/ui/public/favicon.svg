<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Vale brand mark: the vale with a hidden V — the sky between the two
       hills forms the brand letter, the signal rests on its apex -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59f00"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8e1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe8a3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="48" height="48" rx="11" fill="url(#sky)"/>

  <!-- signal resting on the V -->
  <circle cx="24" cy="18" r="7" fill="url(#glow)"/>
  <circle cx="24" cy="18" r="4" fill="#fff8e1"/>

  <!-- far ridge (haze), inner edge straight -->
  <path fill="#ffffff" opacity=".78" d="M46 41Q40 19 33 25L24 37Z"/>
  <!-- near hill (solid), inner edge straight — together the sky forms a V -->
  <path fill="#ffffff" d="M2 41Q8 20 15 26L24 37Z"/>
</svg>
