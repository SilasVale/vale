<body>
<main class="card">
  <h1>Vale Studio Links</h1>
  <div class="row">
    <button id="save">Save</button>
    <span id="saved" class="saved hidden">Saved</span>
  </div>

  <h1 style="margin-top:28px;font-size:16px">Vale Studio 链接改写</h1>
  <label for="studioOrigin">Studio origin</label>
  <input id="studioOrigin" type="url" placeholder="https://code.saisi.online" spellcheck="false">
  <label for="studioToken">Studio token</label>
  <input id="studioToken" type="password" placeholder="token from ~/.vale-studio/config.json" spellcheck="false" autocomplete="off">
  <label class="chk"><input id="studioLinksEnabled" type="checkbox" checked> 在 DSH 页面把文件路径改成 Studio 深链</label>
  <p class="hint">改写后的链接在新标签打开 code.saisi.online 并定位到对应行。</p>
</main>
