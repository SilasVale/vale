<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vale Browser Control — Options</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Cpath d='M20 16 L32 48 L44 16' fill='none' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="options.css">
</head>
<body>
<main class="card">
  <h1>Vale Browser Control</h1>
  <label for="consoleOrigin">Console origin</label>
  <input id="consoleOrigin" type="url" placeholder="https://api.saisi.online" spellcheck="false">
  <p class="hint">The Vale console this extension pairs with — used for /api/plugins/* (pairing, WS) and controlled tabs.</p>
  <div class="row">
    <button id="save">Save</button>
    <span id="saved" class="saved hidden">Saved</span>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
