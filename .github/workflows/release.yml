# Vale Desktop — cross-platform release build (Codex-style matrix).
#
# On a tag push (v*), builds vale-desktop for Windows / Linux / macOS with
# Tauri's bundler, bundles cloudflared (Windows) alongside the agent
# installer, and publishes every artifact to the GitHub Release. This is the
# "one package, everything included" path: the Windows NSIS installer embeds
# vale-agent + vale-desktop + playwright + cloudflared; Linux/macOS get the
# desktop shell (AppImage/deb / dmg) that connects to a local/remote agent.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v0.1.0)"
        required: false

permissions:
  contents: write

jobs:
  vale-desktop:
    name: vale-desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            cloudflared: true
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            cloudflared: false
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            cloudflared: false
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Linux: Tauri needs the webkit2gtk stack.
      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Windows cross deps (cargo-xwin)
        if: matrix.platform == 'windows-latest'
        run: cargo install cargo-xwin

      - name: Install tauri CLI
        working-directory: agent/vale-desktop
        run: npm install

      - name: Download cloudflared (Windows, bundled)
        if: matrix.cloudflared
        run: |
          curl -fL --retry 3 -o agent/deploy/cloudflared.exe \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          ls -la agent/deploy/cloudflared.exe

      - name: Build vale-desktop bundle
        working-directory: agent/vale-desktop
        run: npx tauri build ${{ matrix.args }}

      - name: Build Windows all-in-one installer (agent + desktop + cloudflared)
        if: matrix.platform == 'windows-latest'
        run: |
          ./scripts/build-installer.sh
        env:
          MAKENSIS: ${{ runner.tool_cache }}/nsis/makensis.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vale-${{ matrix.platform }}
          path: |
            agent/vale-desktop/src-tauri/target/**/release/bundle/**/*
            index/public/vale-agent/ValeAgent-Setup.exe
            agent/deploy/cloudflared.exe

  publish:
    name: Publish GitHub Release
    needs: vale-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vale ${{ github.ref_name }}
          draft: true
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.dmg
            dist/**/*.rpm
            dist/**/*.tar.gz
