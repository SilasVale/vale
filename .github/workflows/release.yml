# Vale Agent — tag-triggered release pipeline.
#
# Replaces the retired Tauri matrix (NSIS era): the ONLY shipped desktop
# artifact is the npm agent package. On a v<semver> tag push this builds the
# Windows exe via cargo-xwin (same matrix CI checks), builds the panel SPA
# that the exe EMBEDS at compile time (include_str!), packs the npm tgz, and
# attaches it to the GitHub Release. package.json version must equal the tag
# (the release flow bumps package.json, commits, then tags — a mismatch
# fails fast).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # The tag-commit CI gate below polls check-runs + commit statuses via
  # gh api — those endpoints need these read scopes (unspecified scopes
  # default to none once `permissions:` is set).
  actions: read
  checks: read
  statuses: read

# Tag rebuilds must SERIALIZE: two runs for the same tag racing
# `gh release create` collide (one wins, one fails) — queue, never cancel.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    name: agent (xwin build → npm tgz → release asset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A tag cut from red/stale main used to build + `gh release create`
      # anyway — the package.json-vs-tag compare below only checks the
      # version STRING. Gate on the tag commit's combined check status
      # first (Actions check-runs + external commit statuses): fail fast
      # on any failure/cancelled, wait bounded (~10 min: 30x20s) while
      # checks are still running. gh is preinstalled on ubuntu-latest; the
      # two --jq filters are elementary jq (@tsv shaping only — no jq
      # variables, no extra dependencies). The run's OWN check-run
      # (in_progress while this step runs) is excluded by its /runs/<id>/
      # job URL, matched on the URL field only (never the job name).
      # Fail-CLOSED: any gh api error (set -euo pipefail) fails the
      # release, never passes it; total silence (no checks reported at
      # all) waits, never passes.
      # Bypass: once CI is green on the tag commit, re-run this workflow
      # (Re-run jobs) — no code change needed.
      - name: Gate on tag-commit CI status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "tag ${GITHUB_REF_NAME} -> commit ${SHA} (self run ${GITHUB_RUN_ID} excluded)"
          PASS=0
          for i in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.status, (.conclusion // "-"), .name, (.html_url // "")] | @tsv' \
              > /tmp/ci-gate-runs-all.tsv
            awk -F'\t' -v self="/runs/${GITHUB_RUN_ID}/" '$4 !~ self' \
              /tmp/ci-gate-runs-all.tsv > /tmp/ci-gate-runs.tsv
            read -r EXT_STATE EXT_N <<< "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" --jq '"\(.state) \(.total_count)"')"
            BAD=""; PENDING=""
            while IFS="$(printf '\t')" read -r ST CO NM _URL; do
              [ -z "$ST" ] && continue
              case "${ST}:${CO}" in
                completed:failure|completed:cancelled|completed:timed_out|completed:action_required)
                  BAD="${BAD}${BAD:+, }${NM}" ;;
                completed:*) ;;
                *) PENDING="${PENDING}${PENDING:+, }${NM}" ;;
              esac
            done < /tmp/ci-gate-runs.tsv
            if [ -n "$BAD" ]; then
              echo "::error::tag commit ${SHA} has FAILED checks: ${BAD} — not releasing a red commit (bypass: fix CI on main, move the tag, re-run this workflow)"
              exit 1
            fi
            if [ "$EXT_N" -gt 0 ] && { [ "$EXT_STATE" = "failure" ] || [ "$EXT_STATE" = "error" ]; }; then
              echo "::error::tag commit ${SHA} has FAILED external statuses (state=${EXT_STATE}) — not releasing a red commit (bypass: fix CI on main, move the tag, re-run this workflow)"
              exit 1
            fi
            # Fail-CLOSED on silence: zero check-runs + zero statuses means
            # CI has not reported yet (or never will) — WAIT, never pass.
            N_ALL=$(grep -c . /tmp/ci-gate-runs.tsv || true)
            if [ -z "$PENDING" ] && [ "$N_ALL" -gt 0 ] && { [ "$EXT_N" -eq 0 ] || [ "$EXT_STATE" = "success" ]; }; then
              echo "CI green on ${SHA} (${N_ALL} check-runs + external state=${EXT_STATE},n=${EXT_N}) — proceeding"
              PASS=1
              break
            fi
            echo "attempt ${i}/30: waiting on checks [${PENDING:-none}] external=${EXT_STATE},n=${EXT_N} — sleeping 20s"
            sleep 20
          done
          if [ "$PASS" != "1" ]; then
            echo "::error::timed out (~10 min) waiting for CI on tag commit ${SHA} — not releasing blind (bypass: wait for CI to go green, then Re-run jobs)"
            exit 1
          fi
      # Pinned, never @stable: the local release box and this runner must build
      # with the SAME rustc, or the two exes can never be byte-identical — the
      # exact reason the dual-builder audit used to be unsatisfiable. Kept in
      # sync with rust-toolchain.toml (source of truth for local builds).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          # llvm-ar lives here; the cargo-xwin cache links to it below.
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # LLVM 18.1.8 from the OFFICIAL release tarball — the same artifact the
      # local release box has extracted at ~/llvm18. NOT apt.llvm.org and NOT
      # the distro `llvm` package: those are per-distro builds, and the
      # resulting lld laid .data out differently (measured on 1.2.317 — a
      # 32-byte shift plus a 0x100 difference in where rust_panic landed),
      # which is what still kept the two exes apart.
      - name: Cache the LLVM tarball (1 GB — fetch once per runner cache)
        uses: actions/cache@v4
        with:
          path: /tmp/llvm.tar.xz
          key: llvm-18.1.8-official-ubuntu18.04
      - name: Extract LLVM 18.1.8 (official tarball)
        run: |
          set -euo pipefail
          TB=/tmp/llvm.tar.xz
          if [ ! -s "$TB" ]; then
            curl -fsSL -o "$TB" \
              https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          fi
          mkdir -p "$HOME/llvm18"
          tar xf "$TB" -C "$HOME/llvm18" --strip-components=1
          # This tarball is built for ubuntu-18.04 and links libtinfo.so.5,
          # which the 24.04 runner does not ship (it has .so.6 only) — clang
          # dies with "error while loading shared libraries". Supply focal's
          # ncurses5 library beside it (dpkg-deb -x, no sudo) and export it for
          # every later step, so CI's clang/lld run against the same sonames the
          # local release box resolves.
          curl -fsSL -o /tmp/libtinfo5.deb \
            http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2.1_amd64.deb
          dpkg-deb -x /tmp/libtinfo5.deb "$HOME/llvm18-compat"
          # GITHUB_ENV only takes effect for LATER steps, so export it here as
          # well — otherwise the verification line below fails on the very
          # soname this step just provided.
          export LD_LIBRARY_PATH="$HOME/llvm18-compat/lib/x86_64-linux-gnu"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          "$HOME/llvm18/bin/clang" --version | head -1
      # cargo-xwin resolves its tools from ~/.cache/cargo-xwin — mirror the
      # local box's layout exactly (clang / lld-link / llvm-rc out of the LLVM
      # tree, archivers out of the pinned toolchain) so both builders invoke the
      # same binaries.
      - name: Point cargo-xwin at that LLVM
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/cargo-xwin"
          ln -sf "$HOME/llvm18/bin/clang"    "$HOME/.cache/cargo-xwin/clang-cl"
          ln -sf "$HOME/llvm18/bin/lld-link" "$HOME/.cache/cargo-xwin/lld-link"
          ln -sf "$HOME/llvm18/bin/llvm-rc"  "$HOME/.cache/cargo-xwin/llvm-rc"
          AR="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-ar"
          ln -sf "$AR" "$HOME/.cache/cargo-xwin/llvm-lib"
          ln -sf "$AR" "$HOME/.cache/cargo-xwin/llvm-dlltool"
      # Pinned: a bare `cargo install cargo-xwin` grabs whatever is newest that
      # day, which is another silent source of build drift.
      - name: Install cargo-xwin (pinned)
        run: cargo install cargo-xwin --locked --version 0.23.0
      # panel.js is include_str!-embedded — it must be built BEFORE the exe.
      - name: Build panel SPA
        run: npm ci --include=optional && npm run build
        working-directory: agent/resources/panel-react
      - name: Test panel SPA
        run: npm test
        working-directory: agent/resources/panel-react
      - name: Cross-compile the agent exe
        working-directory: agent
        run: |
          set -euo pipefail
          # Normalise the paths rustc bakes into the binary. The two builders
          # sit at different home/workspace paths and those embedded strings
          # alone make the exes differ; both sides map to the same placeholders.
          # Workspace FIRST — it lives under $HOME, so the more specific prefix
          # must win.
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/src --remap-path-prefix=${HOME}=/buildhome"
          cargo xwin build -p vale-agent --target x86_64-pc-windows-msvc --release --features terminal,keyring --bin vale-agent
      - name: Pack the npm artifact
        working-directory: agent
        run: |
          set -euo pipefail
          VER=$(node -p "require('./vale-agent-npm/package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json version ${VER} — the release commit must bump package.json first"
            exit 1
          fi
          cp target/x86_64-pc-windows-msvc/release/vale-agent.exe vale-agent-npm/vale-agent.exe
          # round-298 lesson: bin/vale.js is a COMMITTED tsc artifact; a
          # stale copy (source changed, build not re-run) would ship the
          # old CLI. Compile it fresh — typescript + @types/node only (the
          # electron postinstall download is not needed for tsc).
          # vale-agent-npm package.json is os:win32 — --force skips the
          # platform check on the Linux runner.
          (cd vale-agent-npm && npm install --no-save --ignore-scripts --force typescript@5 @types/node@22)
          (cd vale-agent-npm && ./node_modules/.bin/tsc -p tsconfig.json)
          cp vale-agent-npm/dist/vale.js vale-agent-npm/bin/vale.js
          grep -q "vale-release" vale-agent-npm/bin/vale.js || { echo "::error::compiled bin/vale.js missing round-298 marker"; exit 1; }
          # round-321: electron main/preload/url-policy .js are COMMITTED tsc
          # artifacts (tsc outDir is dist/, the npm package ships src/*.js) —
          # a stale copy ships silently. Compile the electron TS fresh and
          # fail if the committed src/*.js differ from the fresh output.
          # Runs inside vale-agent-npm (its node_modules holds tsc; typeRoots
          # points at its own @types — electron's node_modules is not
          # installed in CI, so full typecheck CANNOT pass here (electron
          # module + Electron namespace unresolvable). --noCheck emits
          # without typechecking: the gate compares EMIT output, which is
          # exactly what ships. (Device-caught on 1.2.286: without it the
          # gate failed every release on missing electron types.)
          (cd vale-agent-npm && ./node_modules/.bin/tsc -p ../vale-desktop-electron/tsconfig.json \
            --typeRoots ./node_modules/@types --outDir /tmp/electron-fresh --noCheck)
          for F in main.js preload.js url-policy.js; do
            if ! cmp -s "/tmp/electron-fresh/${F}" "vale-desktop-electron/src/${F}"; then
              echo "::error::vale-desktop-electron/src/${F} is stale (ts source changed without recompiling) — run tsc and commit the fresh output"
              exit 1
            fi
          done
          echo "electron src freshness check OK"
          cd vale-agent-npm && npm pack
          # round-278/282 lesson: verify the packed tgz ships every file the
          # device update flow swaps (a missing file silently keeps the stale
          # one on devices). Fail the release if any is absent.
          TGZ="vale-agent-${VER}.tgz"
          # Paths inside npm-packed tgzs carry a "package/" prefix on some
          # npm versions and not others — match by basename instead.
          # NOTE: pipefail + grep -q = SIGPIPE kills tar mid-stream and the
          # pipeline FAILS even when the file IS present (device-caught on
          # release 1.2.272) — list to a temp file first, then grep.
          tar tzf "$TGZ" > "/tmp/tgz-list-${VER}.txt"
          for F in "vale-agent.exe" \
                   "vale-desktop-electron/src/main.js" \
                   "vale-desktop-electron/src/preload.js" \
                   "vale-desktop-electron/src/url-policy.js" \
                   "vale-desktop-electron/icon.png" \
                   "vale-desktop-electron/icon.ico" \
                   "bin/vale.js"; do
            if ! grep -qE "(^|/)${F}$" "/tmp/tgz-list-${VER}.txt"; then
              echo "::error::tgz missing required file: $F"
              exit 1
            fi
          done
          echo "tgz content check OK ($TGZ)"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Create release with the tgz asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "agent/vale-agent-npm/vale-agent-${VER}.tgz" \
            --title "Vale Agent ${VER}" \
            --notes "Built by CI from ${GITHUB_REF_NAME}. Install: npm i -g https://agent.saisi.online/vale-agent/vale-agent-${VER}.tgz && vale update" \
            --verify-tag
